crons:
  - name: attendance-reminder
    description: "Mengingatkan siswa yang belum absen pukul 08:00 WIB (email + notifikasi Sakit/Izin)"
    cron: "0 8 * * *"
    timezone: "Asia/Jakarta"
    endpoint: "{{BASE_URL}}/api/cron/attendance-reminder"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
  - name: attendance-auto-alpha
    description: "Menandai Alpa otomatis siswa tanpa kabar pukul 09:00 WIB"
    cron: "0 9 * * *"
    timezone: "Asia/Jakarta"
    endpoint: "{{BASE_URL}}/api/cron/attendance-auto-alpha"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
  - name: attendance-archive
    description: "Mengarsipkan rekap absensi mingguan setiap Senin 01:00 WIB"
    cron: "0 1 * * 1"
    timezone: "Asia/Jakarta"
    endpoint: "{{BASE_URL}}/api/cron/attendance-archive"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
  - name: kas-reminder
    description: "Pengingat uang kas kelas tiap tanggal 1 pukul 07:00 WIB (00:00 UTC)"
    cron: "0 0 1 * *"
    endpoint: "{{BASE_URL}}/api/cron/kas-reminder"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
  - name: piket-reminder
    description: "Mengirim pengingat ke guru sekitar 30 menit sebelum shift piket gerbang dimulai"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/piket-reminder"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
