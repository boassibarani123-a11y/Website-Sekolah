crons:
  - name: attendance-archive
    description: "Tiap Senin dini hari: ekspor rekap absensi mingguan ke Excel, simpan ke Storage Rekap, lalu hapus data absensi mingguan dari website"
    cron: "0 1 * * 1"
    timezone: "Asia/Jakarta"
    endpoint: "{{BASE_URL}}/api/cron/attendance-archive"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: attendance-reminder
    description: "Senin-Sabtu 08:00 WIB: email + notifikasi ke siswa yang belum absen agar konfirmasi Sakit/Izin"
    cron: "0 8 * * 1-6"
    timezone: "Asia/Jakarta"
    endpoint: "{{BASE_URL}}/api/cron/attendance-reminder"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: attendance-auto-alpha
    description: "Senin-Sabtu 09:00 WIB: siswa tanpa scan atau konfirmasi otomatis tercatat Alpa"
    cron: "0 9 * * 1-6"
    timezone: "Asia/Jakarta"
    endpoint: "{{BASE_URL}}/api/cron/attendance-auto-alpha"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
